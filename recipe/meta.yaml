{% set name = "fonticon-fontawesome5" %}
{% set version = "5.15.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4ce06b3bf0169dceede72ddd07d92b0d7476e8b47f452fe4b1bde8f0423b7adb

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - fonticon_fa5
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check

about:
  home: https://github.com/tlambert03/fonticon-fontawesome5
  summary: 'FontAwesome 5 extension for superqt font icons'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/tlambert03/fonticon-fontawesome5

extra:
  recipe-maintainers:
    - tlambert03
